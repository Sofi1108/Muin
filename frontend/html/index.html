<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MUIN | Tienda de Anime</title>
    <link rel="stylesheet" href="../styles/home.css" />
  </head>
  <body>
    <header>
      <div class="logo">MUIN</div>
      <div class="nav-icons">
        <span>🛒</span>
        <span>👤</span>
      </div>
    </header>

    <section class="hero">
      <div class="promo-badge">
        15% DE DESCUENTO <br />
        <small>Sé Muin</small>
      </div>
      <h1>M U I N</h1>
      <p>YOUR NINDO NEEDS NO SEAL</p>
      <button class="btn-buy">BUY NOW</button>
    </section>

    <main class="container">
      <section class="categories-grid">
        <div class="cat-item">
          <div class="img-placeholder empty"></div>
          <p>SHIRTS</p>
        </div>
        <div class="cat-item">
          <div class="img-placeholder empty"></div>
          <p>HOODIES</p>
        </div>
        <div class="cat-item">
          <div class="img-placeholder empty"></div>
          <p>ACCESSORIES</p>
        </div>
        <div class="cat-item">
          <div class="img-placeholder empty"></div>
          <p>SALES</p>
        </div>
      </section>

      <h2>Nuevos Productos</h2>
      <div id="nuevos-productos" class="products-grid"></div>

      <h2>Best Sellers</h2>
      <div id="best-sellers" class="products-grid"></div>

      <section class="testimonials">
        <h2>What the Ninjas say</h2>
        <div class="reviews-grid">
          <div class="review-card">
            <div class="stars">☆☆☆☆☆</div>
            <strong>Review title</strong>
            <p>Review body description...</p>
            <small>Reviewer name | Date</small>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-content">
        <div class="footer-col">
          <h4>Legal information</h4>
          <ul>
            <li>Privacy Policy</li>
            <li>Cookies Policy</li>
          </ul>
        </div>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
